<!DOCTYPE html>
<html lang="en">
<!-- Hi sweetheart, this was made by Nuska <3-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[S]_C.A.P.E Wiki - Gallery</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!-- Weirdcore Background Elements -->
    <div class="weirdcore-container">
        <div class="weirdcore-text" data-text="REMEMBER">REMEMBER</div>
        <div class="weirdcore-text" data-text="YOU ARE HERE">YOU ARE HERE</div>
        <div class="weirdcore-text" data-text="WAKE UP">WAKE UP</div>
        <div class="weirdcore-text" data-text="DON'T FORGET">DON'T FORGET</div>
        <div class="weirdcore-text" data-text="IT'S WATCHING">IT'S WATCHING</div>
    </div>

    <div class="page-container">
        <!-- Main Content Area -->
        <div class="content-wrapper">
            <!-- Sidebar placeholder -->
            <div class="sidebar-placeholder"></div>

            <!-- Main Article Content -->
            <main class="main-content">
                <article class="wiki-article">
                    <h1 class="article-title">Gallery</h1>

                    <!-- Article Content -->
                    <section id="concept-art">
                        <h2>Concept Art</h2>
                        <div class="gallery-grid"></div>
                    </section>

                    <!-- Lightbox -->
                    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
                        <button class="lightbox-close" onclick="closeLightbox()">&#x2715;</button>
                        <img class="lightbox-img" id="lightbox-img" src="" alt="">
                        <div class="lightbox-caption" id="lightbox-caption"></div>
                    </div>

                    <!-- Navbox placeholder -->
                    <div class="navbox-placeholder"></div>
                </article>
            </main>
        </div>

        <!-- Footer placeholder -->
        <div class="footer-placeholder"></div>
    </div>

    <script src="assets/js/template-loader.js"></script>
    <script src="assets/js/weirdcore.js"></script>
    <script src="assets/js/gallery-loader.js"></script>
</body>

</html>
